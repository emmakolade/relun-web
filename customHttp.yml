# AWS Amplify Hosting response headers for relun-web (site + app).
# No Content-Security-Policy on purpose: Firebase messaging, Paystack Inline
# (script + checkout iframe), socket.io and OpenStreetMap all need allowances
# that should be tested before one is added.
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=(), usb=()
